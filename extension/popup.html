<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>表格采集助手</title><style>
*{box-sizing:border-box}body{width:340px;margin:0;padding:18px;background:#f3f5ee;color:#183e32;font:14px/1.55 system-ui,sans-serif}h1{font-size:20px;margin:0}p{color:#4c655a}label{display:grid;gap:4px;margin:9px 0}button,select{border:1px solid #c0cec2;border-radius:6px;padding:8px;background:white;color:inherit}button{background:#125944;color:white;cursor:pointer}button:disabled{opacity:.5}#msg{white-space:pre-wrap}</style></head><body><h1>网页表格采集</h1><p>读取当前页中的 HTML 表格，选择列后保存为工作台可导入的 CSV。</p><button id="scan">读取当前页</button><div id="config" hidden><label>目标表格<select id="table"></select></label><label>数据类型<select id="kind"><option value="orders">订单</option><option value="payments">流水</option></select></label><div id="fields"></div><button id="download">导出本页 CSV</button></div><p id="msg" role="status"></p><script src="popup.js"></script></body></html>
